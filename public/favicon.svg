<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <defs>
    <style>
      .trace-line { stroke: #FFFFFF; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .trace-node { fill: none; stroke: #FFFFFF; stroke-width: 4; }
      .brand-title { font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 38px; fill: #FFFFFF; letter-spacing: 4px; }
      .brand-sub { font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 21px; fill: #FFFFFF; letter-spacing: 6.5px; }
    </style>
  </defs>

  <!-- Circuit Icon -->
  <g transform="translate(10, 10)">
    <!-- Circuit Node 1 (Top left) -->
    <circle cx="50" cy="35" r="12" class="trace-node" />
    <path d="M 62 35 L 75 35 L 90 50 L 155 50" class="trace-line" />

    <!-- Circuit Node 2 (Middle) -->
    <circle cx="75" cy="70" r="12" class="trace-node" />
    <path d="M 87 70 L 155 70" class="trace-line" />

    <!-- Circuit Node 3 (Lower left) -->
    <circle cx="30" cy="85" r="12" class="trace-node" />
    <path d="M 42 85 L 60 85 L 75 100 L 155 100" class="trace-line" />

    <!-- Circuit Node 4 (Bottom) -->
    <circle cx="55" cy="120" r="12" class="trace-node" />
    <path d="M 67 120 L 90 120 L 105 105 L 155 105" class="trace-line" />
  </g>

  <!-- Typography -->
  <text x="185" y="80" class="brand-title">PRINTER</text>
  <text x="185" y="112" class="brand-sub">INFORMÁTICA</text>
</svg>